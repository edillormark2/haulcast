[project]
name = "haulcast-api"
version = "0.1.0"
description = "Weather-aware truck routing API: routes, checkpoint weather, risk scoring and recommendation."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DJ", "PT", "N", "C4", "RET"]
# En dashes are deliberate: user-facing ranges read "25–34 mph", as in the brief.
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
"planner/tests/*" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["planner/tests/"]

[[tool.mypy.overrides]]
module = ["planner.api.*"]
disallow_subclassing_any = false
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings"
